# Formulas whose digits must be the same natively and in the browser
# (hapto-p0n.6): transcendental functions through libm, seeded random
# numbers, OKLab colour mixing. tests/parity.rs pins them in parity.json;
# the Node tests check the wasm build reads the same.
hapto: 2
alt: "Parity at x = {x:.3f}."
values:
  - { name: x, type: number, range: [-3, 3], default: 0.7 }
let:
  trig: '[sin(x), cos(x), tan(x), asin(x / 3), acos(x / 3), atan(x), atan2(x, -1.3)]'
  hyper: '[sinh(x), cosh(x), tanh(x)]'
  exps: '[exp(x), ln(x + 3.5), log10(x + 3.5), log2(x + 3.5), sqrt(x + 3.5), cbrt(x), (x + 3.5) ** 0.37]'
  special: '[normal_pdf(x, 0, 1), normal_cdf(x, 0, 1), factorial(7), choose(9, 4)]'
  random: '[rand(1, 2), rand(17, 3), randn(0, 1)]'
  colour: 'mix(#ff0000, #0000ff, x / 3 + 0.5)'
  series: 'sum(sin(k * x) / k for k in range(1, 200))'
view: { x: { range: [-3, 3] }, y: { range: [-3, 3] } }
marks:
  - { point: '[x, sin(x)]' }
