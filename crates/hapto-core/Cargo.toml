[package]
name = "hapto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "State in, drawing out: the core of a figure that reacts."

[dependencies]
hapto-expr.workspace = true
yaml-rust2.workspace = true
kinemo-ir.workspace = true
kinemo-eval.workspace = true
kinemo-layout.workspace = true
kinemo-math.workspace = true
kinemo-text.workspace = true
kinemo-render.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kinemo-render.workspace = true
# Reading golden images back (§21.3); already in the tree through kinemo.
png = "0.18"

[features]
# Typeset TeX natively with typst: on for the command line and book builds,
# off for the browser, which draws layouts baked ahead of time (SPEC-2.0 §10.4).
typeset = ["kinemo-math/typeset"]

[[example]]
name = "m0_rebuild"
required-features = ["typeset"]
