[package]
name = "hapto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "State in, drawing out: the core of a figure that reacts."

[dependencies]
hapto-expr.workspace = true
yaml-rust2.workspace = true
kinemo-ir.workspace = true
kinemo-eval.workspace = true
kinemo-layout.workspace = true
kinemo-render.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kinemo-render.workspace = true
# Only the M0 benchmark typesets TeX. kinemo-math's default `typeset` feature
# pulls in typst, which takes the browser build from 1.3 MB to 11.4 MB brotli,
# so it must stay out of the normal dependencies. See docs/m0.md.
kinemo-math.workspace = true
