hapto: 2
id: shapes
title: "Toda a família de curvas"
alt: "Uma galeria de formas que reagem a k = {k:.2f}."
size: { aspect: 16/9 }
values:
  - { name: k, type: number, range: [0, 1], default: 0.5 }
view:
  x: { range: [0, 16] }
  y: { range: [0, 9] }
  axes: none
marks:
  - { function: { x: "2 + 1.4*cos(3*t)", y: "6.6 + 1.4*sin((1 + 3*k)*t)" }, var: t, domain: [0, tau], samples: 400 }
  - { ellipse: "[6.5, 6.6]", rx: "1.5", ry: "0.5 + k", tilt: "k*pi", style: { stroke: cool, fill: cool, fill_opacity: 0.15 } }
  - { arc: "[10.5, 6.6]", r: 1.3, from: 0, to: "0.3 + k*5.9", style: { stroke: hot, width: heavy } }
  - { sector: "[14, 6.6]", r: 1.4, inner: "0.7*k", from: 0.4, to: "0.4 + 1.5 + 3*k", style: { fill: positive, fill_opacity: 0.5 } }
  - { bezier: "[[0.8, 1.2], [2 + 3*k, 4.2], [4 - 3*k, 0.4], [4.4, 3]]", style: { stroke: accent, width: heavy } }
  - { spring: "[[5.8, 2.2], [7.4 + 2.2*k, 2.2]]", coils: 9, width: 14 }
  - { point: "[7.4 + 2.2*k, 2.2]", r: 9, shape: square, style: { fill: fg } }
  - { brace: "[[11, 1.1], [15, 1.1]]", side: left, depth: "8 + 16*k" }
  - { path: "M 11 1.4 L 12 3.4 L 13 1.9 L 14 3.8 L 15 1.4", style: { stroke: "mix(palette('cool'), palette('hot'), k)", width: line } }
  - point: "[0.8 + i*0.45, 0.4]"
    r: 5
    shape: circle
    style: { fill: "colour_scale('cyclic', i/18 + k, 0, 1)" }
    repeat: { i: "range(0, 10)" }
  - text: "elipse · arco · setor · Bézier · mola · chaveta · path"
    at: "[16, 0]"
    anchor: bottom-right
    size: 12
    offset: [-6, 6]
  - { text: "Lissajous 3 : {1 + 3*k:.1f}", at: "[2, 4.6]", anchor: top, size: 12 }
