[workspace]
members = [
    "crates/hapto-expr",
    "crates/hapto-core",
    "crates/hapto-cli",
    "crates/hapto-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/m4nd0r4s/hapto"
# Not on crates.io yet: the API is still being found.
publish = false

[workspace.dependencies]
hapto-core = { path = "crates/hapto-core" }
hapto-expr = { path = "crates/hapto-expr" }

# kinemo's drawing crates, pinned to a commit. They are `publish = false` and
# depend on each other by path, which Cargo rewrites inside a git dependency:
# `cargo check` on exactly this resolves and builds.
#
# What is taken: text shaping, maths typeset without a TeX installation,
# constraint layout, the renderer, and the expression evaluator.
# What is left behind: the timeline. See docs/why.md.
kinemo-ir = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75" }
kinemo-eval = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75" }
kinemo-layout = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75" }
# Subset faces (Latin, Greek, arrows, maths): 0.27 MB brotli instead of
# 1.03 MB, byte-identical renders on the corpus (docs/fonts.md). On for every
# target, so native renders, goldens and the browser draw the same glyphs.
kinemo-text = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75", features = ["subset-fonts"] }
# Without typst unless a crate asks (`typeset`): typst takes the browser
# build from 1.3 MB to 11.4 MB brotli (docs/m0.md).
kinemo-math = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75", default-features = false }
kinemo-render = { git = "https://github.com/m4nd0r4s/kinemo.git", rev = "c34a241e7b67e0aa18638ee8e09e039b3eb8ce75" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# YAML 1.2 in pure Rust, so documents parse the same natively and in wasm.
yaml-rust2 = "0.10"
# One implementation of sin, exp and friends on every target, so a native test
# and the browser compute the same digits (SPEC-2.0 §3.5).
libm = "0.2"
proptest = "1"

[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
